    - heading "Impartiality & Confidentiality." [level=2] [ref=e709]
    - generic [ref=e710]:
      - paragraph [ref=e711]: MPowerRatings (Pty) Ltd is governed by several principles as stipulated by the SANAS R47-03. One of which carries significant weighting is the principle of Impartiality and Confidentiality.
      - paragraph [ref=e712]: "Impartiality can be defined as:"
      - paragraph [ref=e713]: The actual and perceived presence of objectivity. Being impartial is essential for a B-BBEE Verification Agency to deliver a verification that inspires confidence in the process. MPowerRatings demonstrates that its decisions are based on verifying objective evidence and have not been improperly influenced by other interests or parties. We maintain our objectivity in respect of each verification while being professional, responsible, transparent and maintaining confidentiality.
  - generic [ref=e718]:
