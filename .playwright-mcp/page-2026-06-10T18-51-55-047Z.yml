      - heading "Our Offices" [level=2] [ref=e721]
    - paragraph [ref=e722]:
      - text: We're ready to lead you into the future of B-BBEE. You're not going to hit a ridiculously long phone menu when you call us. Your email isn't going to the inbox abyss, never to be seen or heard from again. At mPowerRatings, we provide the exceptional service we'd want to experience ourselves!
      - text: We operate in an industry built on trust — from the first contact past your tenth verification with us. At mPowerRatings, you always talk to a human!
