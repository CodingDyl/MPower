    - paragraph [ref=e186]:
      - text: mPowerRatings is a SANAS Accredited B-BBEE Verification Agency with BVA number 204. Established in 2004, we have been at the forefront of transformation for more than a decade. Through expert knowledge on B-BBEE, we aim to drive sustainable and meaningful transformation to ensure inclusive growth within the South African economy. We are perfectly positioned to guide our clients through the transformation landscape. mPowerRatings is a 51% Black Female Owned Level 2 B-BBEE Contributor using the QSE Scorecard. To find out more, contact us at
